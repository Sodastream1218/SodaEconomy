name: Bug report
description: Report a reproducible problem in SodaEconomy.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Check the documentation/troubleshooting guide first, then provide enough information to reproduce the problem. Remove passwords, tokens and other secrets.

  - type: input
    id: plugin-version
    attributes:
      label: SodaEconomy version
      placeholder: "Example: 1.0.0"
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server software and version
      placeholder: "Example: Paper 1.21.x build 123"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "Output of: java -version"
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Storage backend
      options:
        - YAML
        - SQLite
        - MySQL
        - MariaDB
    validations:
      required: true

  - type: input
    id: database-version
    attributes:
      label: Database version (MYSQL/MariaDB only)
      placeholder: "Example: MariaDB 11.8"

  - type: checkboxes
    id: integrations
    attributes:
      label: Active integrations / topology
      options:
        - label: Vault
        - label: PlaceholderAPI
        - label: Floodgate / Geyser
        - label: Multi-server shared MYSQL/MariaDB

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the server
        2. Run /eco ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack trace
      description: Remove credentials and other sensitive data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I checked the troubleshooting/documentation pages.
          required: true
        - label: I tested this with the latest available SodaEconomy release that applies to my setup.
          required: true
        - label: I removed passwords, tokens and other sensitive data.
          required: true
