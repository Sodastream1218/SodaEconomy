name: Support question
description: Ask for help with setup, configuration or usage.
title: "[Support]: "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Please check the FAQ and troubleshooting guide first. Never include database passwords, tokens or other secrets.

  - type: input
    id: plugin-version
    attributes:
      label: SodaEconomy version
      placeholder: "Example: 1.0.0"
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server software and version
      placeholder: "Example: Paper 1.21.x build 123"
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "Output of: java -version"
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Storage backend
      options:
        - YAML
        - SQLite
        - MySQL
        - MariaDB
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe what you are trying to do, what you already tried, and where you are stuck.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Remove passwords and sensitive values before posting.
      render: yaml
