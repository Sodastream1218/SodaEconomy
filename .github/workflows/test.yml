name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: sodaeconomy_test
          MYSQL_USER: sodaeconomy_test
          MYSQL_PASSWORD: sodaeconomy_test_password
          MYSQL_ROOT_PASSWORD: sodaeconomy_test_root_password
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=20s
    env:
      SODAECONOMY_TEST_MYSQL: 'true'
      SODAECONOMY_TEST_MYSQL_HOST: 127.0.0.1
      SODAECONOMY_TEST_MYSQL_PORT: '3306'
      SODAECONOMY_TEST_MYSQL_DATABASE: sodaeconomy_test
      SODAECONOMY_TEST_MYSQL_USER: sodaeconomy_test
      SODAECONOMY_TEST_MYSQL_PASSWORD: sodaeconomy_test_password
      MYSQL_ROOT_PASSWORD: sodaeconomy_test_root_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Wait for MySQL and configure its test database
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if docker exec '${{ job.services.mysql.id }}' mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; then
              docker exec '${{ job.services.mysql.id }}' mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -e "ALTER DATABASE sodaeconomy_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci; SET GLOBAL time_zone = '+00:00';"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time." >&2
          exit 1

      - name: Compile and run unit and MockBukkit tests
        run: ./gradlew --no-daemon clean test

      - name: Run MySQL integration tests
        run: ./gradlew --no-daemon mysqlIntegrationTest jacocoTestReport jacocoTestCoverageVerification shadowJar
