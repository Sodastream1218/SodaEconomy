# =====================================================================================================
#                                 ⚡ SodaEconomy - Plugin Configuration ⚡
# =====================================================================================================
# -----------------------------------------------------------------------------------------------------
# Configure SodaEconomy's economy, storage, language, integrations, banking, update checks and more.
#
# GitHub:        https://github.com/Sodastream1218/SodaEconomy
# Documentation: https://github.com/Sodastream1218/SodaEconomy/blob/main/docs/README.md
# Discord:       https://discord.gg/pqxAugHgMT
#
# Reload-safe with /eco reload:
#   language, prefix.*, leaderboard.*, currency.*, update-checker.*
#
# Restart required:
#   storage.*, balance, max_balance, integrations.vault.*, banking.*, transactions.*,
#   persistence.async.*, debug.*
#
# Always create a backup before storage migrations or major SodaEconomy upgrades.
# -----------------------------------------------------------------------------------------------------
# =====================================================================================================


# =====================================================================================================
#                                         --- Storage Settings ---
# =====================================================================================================

# Supported storage systems:
#   ➤ SQLITE  - Local database file; recommended default for single-server installations.
#   ➤ YAML    - Human-readable local files; best suited to small or simple installations.
#   ➤ MYSQL   - Shared MariaDB/MySQL storage; recommended for networks or multiple servers.
#
# Changing storage.type can trigger a controlled migration on the next startup. SodaEconomy verifies
# the target backend before importing the source snapshot. Target data is replaced, never merged.
#
# last-storage-type.txt records the last successfully active backend. Do not edit this file manually.
# Back up the current economy data before every storage migration.

storage:

  # Choose between SQLITE, YAML or MYSQL.
  # Default: SQLITE
  type: SQLITE

  # Used only when storage.type is MYSQL. All required connection values are validated before
  # SodaEconomy attempts a connection or migration. Use a dedicated database account, never root.
  mysql:
    host: localhost
    port: 3306
    database: sodaeconomy
    user: sodaeconomy
    password: ""

    # Advanced JDBC compatibility settings. Normally keep these defaults.
    # Timeout values are in milliseconds.
    params:
      useSSL: false
      # Retained for legacy config compatibility; SodaEconomy does not rely on reconnecting
      # inside an active transaction.
      autoReconnect: false
      allowPublicKeyRetrieval: true
      connectTimeout: 5000
      socketTimeout: 30000
      tcpKeepAlive: true

  migration:
    # Required safety confirmation for MYSQL -> YAML/SQLITE migrations.
    # Set to true only when exactly one server is using the SQL database and every other
    # network instance has been stopped.
    confirm-single-server-mysql: false

    # Preview the source snapshot counts without importing data or changing the active-storage marker.
    dry-run: false


# =====================================================================================================
#                                         --- Language Settings ---
# =====================================================================================================

# Language used for SodaEconomy's in-game messages.
# Available: English = "EN", German = "DE", Spanish = "ES"
# Reload-safe with /eco reload.
language: "EN"

prefix:

  # Enables or disables SodaEconomy's message prefix.
  enabled: true

  # Prefix shown before plugin messages. Legacy Minecraft § color codes are supported.
  full_prefix: "§l§8[§2Soda§aEco§l§8] §r"


# =====================================================================================================
#                                         --- General Economy Settings ---
# =====================================================================================================

# Starting wallet balance for newly created player accounts.
# Existing accounts are not reset when this value changes.
# Default: 1000
balance: 1000

# Maximum wallet balance. Use -1 to disable the balance cap.
# Default: 100000
max_balance: 100000


# Controls /topbalance and the default leaderboard size.
# All leaderboard values are reload-safe with /eco reload.
leaderboard:

  # Enables or disables /topbalance.
  # Default: true
  enabled: true

  # Number of players shown when no custom amount is supplied.
  # Must be at least 1 and must not exceed max-entries.
  # Default: 10
  top-entries: 10

  # Highest number accepted as the optional /topbalance amount.
  # Must be at least 1.
  # Default: 50
  max-entries: 50


# =====================================================================================================
#                                         --- Currency Settings ---
# =====================================================================================================

# Controls how money amounts are displayed. Both values are reload-safe with /eco reload.

currency:

  # Currency symbol or name, for example "$", "Coins", "Tokens" or "€ ".
  # Include a space in the value if you want one between the amount and the currency text.
  # Default: "$"
  symbol: "$"

  # false = currency before the amount; true = currency after the amount.
  # Default: false
  display_after_amount: false


# =====================================================================================================
#                                         --- Optional Integrations ---
# =====================================================================================================

# Vault can be enabled or disabled here.
# PlaceholderAPI and Floodgate are detected automatically when installed and require no config block.

integrations:
  vault:
    # Registers SodaEconomy as Vault's economy provider when Vault is installed.
    # Startup-only: restart required after changing this setting.
    enabled: true

    # Maximum cancellable wait for a synchronous Vault operation.
    # Once durable execution has begun, SodaEconomy waits for the definitive transaction result.
    operation-timeout-millis: 3000

    # Logs a rate-limited warning when a synchronous Vault call takes at least this long.
    # Set to 0 to disable slow-call warnings.
    warn-after-millis: 100


# =====================================================================================================
#                                         --- Banking System Settings ---
# =====================================================================================================

# Optional personal banking system. All settings in this section are startup-only.
# Restart the server after changing them.

banking:
  # Enables player bank accounts and /bank commands.
  # Default: false
  enabled: false

  # Enables automatic interest payments for bank balances.
  # Requires banking.enabled: true.
  # Default: false
  interest_enabled: false

  # Decimal interest rate per payout interval. Example: 0.05 = 5%.
  # Requires banking.enabled and banking.interest_enabled.
  # Default: 0.05
  interest_rate: 0.05

  # Minutes between interest payouts.
  # Default: 60
  interest_interval: 60

  # Maximum interest credited to one account per interval. 0 disables the cap.
  # Default: 0.0
  max_interest_per_account: 0.0


# =====================================================================================================
#                                         --- Update Checker ---
# =====================================================================================================

# Optional asynchronous check against the official GitHub Releases API.
# SodaEconomy only informs administrators; it never downloads or installs updates automatically.
# No player names, UUIDs, economy data, server name, plugin list, database data or telemetry ID is sent.
# Disable this feature if the server must not make outbound update-check requests.

# All values in this section are reload-safe with /eco reload.
# Use /eco version to view the cached status or /eco version check to request a manual check.

update-checker:
  enabled: true

  # Release source. Only "github" is supported in v1.0.0.
  source: "github"

  # Allowed release maturity:
  # stable = stable only
  # rc     = rc + stable
  # beta   = beta + rc + stable
  # alpha  = alpha + beta + rc + stable
  channel: "stable"

  # Starts the first asynchronous check shortly after a successful plugin startup.
  check-on-startup: true

  # Hours between automatic checks. Valid range: 1 to 168.
  check-interval-hours: 12

  # Prints a rate-limited console notice when a newer version is available.
  notify-console: true

  # Notifies joining/online players with the sodaeconomy.admin.update permission.
  notify-admins-on-join: true

  # Prevents repeated update notifications for the same player during one login session.
  notify-admins-per-session: true

  # HTTPS connection timeout in seconds. Valid range: 1 to 30.
  connect-timeout-seconds: 4

  # Maximum request/response time in seconds. Valid range: 1 to 60.
  read-timeout-seconds: 6


# =====================================================================================================
#                                    --- Transaction History ---
# =====================================================================================================

# Number of entries shown per /eco history page.
# Valid range: 1 to 100. Restart required after changing this value.
# Default: 10
transactions:
  history-page-size: 10


# =====================================================================================================
#                                   --- Asynchronous Persistence ---
# =====================================================================================================

# Advanced local persistence settings for YAML and SQLite.
# MYSQL remains database-authoritative and does not use this local write-behind queue.

# The queue preserves write order, is bounded and rejects new mutations before in-memory state
# changes if safe persistence can no longer be guaranteed. All settings below are startup-only.
# Keep the defaults unless you have a specific operational reason to tune them.

persistence:
  async:
    # Enables ordered background persistence for local YAML/SQLite storage.
    # Default: true
    enabled: true

    # Initial retry delay after a transient local storage failure, in milliseconds.
    # Default: 100
    initial_retry_delay_millis: 100

    # Maximum retry delay, in milliseconds. Must not be lower than the initial delay.
    # Default: 5000
    maximum_retry_delay_millis: 5000

    # Interval between shutdown-drain warnings, in seconds.
    # Default: 5
    shutdown_warning_interval_seconds: 5

    # Maximum number of accepted local writes waiting for backend persistence.
    # Default: 10000
    queue_capacity: 10000

    # Queue usage percentage that triggers a rate-limited administrator warning.
    # Valid range: 1 to 100. Default: 80
    warning_threshold_percent: 80

    # Immediate retries before persistence pauses and recovery probing begins.
    # Default: 8
    maximum_retry_attempts: 8

    # Delay between recovery probes after persistence has paused, in seconds.
    # Default: 30
    recovery_probe_interval_seconds: 30

    # Maximum normal shutdown drain time, in seconds.
    # Must not be shorter than shutdown_warning_interval_seconds.
    # Default: 30
    shutdown_timeout_seconds: 30


# =====================================================================================================
#                                         --- Debugging Settings ---
# =====================================================================================================

# Enable only the subsystem needed while diagnosing a problem.
# All debug settings are startup-only; restart after changing them.
# Default for every option: false.

debug:
  storage: false          # Storage and persistence diagnostics.
  commands: false         # Command execution diagnostics.
  banking: false          # Banking diagnostics.
  integrations: false     # Vault, PlaceholderAPI and update-checker diagnostics.


# =====================================================================================================
#                                             --- Notes ---
# =====================================================================================================
# -----------------------------------------------------------------------------------------------------
# - /eco reload applies language, prefix, leaderboard, currency and update-checker changes.
# - Restart after changing storage, economy defaults, Vault, banking, transaction, persistence or debug settings.
# - Back up economy data before migrations and major upgrades.
# - Never edit last-storage-type.txt manually.
# - SodaEconomy does not silently fall back from a temporarily unavailable shared SQL database,
#   because doing so could create divergent economy data across servers.
# -----------------------------------------------------------------------------------------------------
# =====================================================================================================
