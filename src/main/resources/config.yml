# ============================================================================
# SodaEconomy configuration
# Documentation: https://github.com/Sodastream1218/SodaEconomy/tree/main/docs
# ============================================================================
# Reload-safe with /eco reload:
#   language, prefix.*, leaderboard.*, currency.*, update-checker.*
# Startup-only (restart required):
#   storage.*, balance, max_balance, integrations.vault.*, banking.*,
#   transactions.*, persistence.async.*, debug.*
# Always back up economy data before storage migrations or major upgrades.

# --- Storage -----------------------------------------------------------------
storage:
  # SQLITE: recommended local default
  # YAML: readable local files for small/simple installations
  # MYSQL: shared JDBC mode for both MySQL and MariaDB
  type: SQLITE

  # Used only when storage.type is MYSQL. All required fields are validated
  # before SodaEconomy attempts a connection or data migration.
  mysql:
    host: localhost
    port: 3306
    database: sodaeconomy
    # Use a dedicated database account; never use root/superuser credentials.
    user: sodaeconomy
    password: ""

    # Advanced JDBC compatibility parameters. Keep defaults unless your
    # database/network policy requires a specific change.
    params:
      useSSL: false
      # Retained for legacy config compatibility; SodaEconomy deliberately does
      # not rely on reconnecting inside an active transaction.
      autoReconnect: false
      allowPublicKeyRetrieval: true
      connectTimeout: 5000
      socketTimeout: 30000
      tcpKeepAlive: true

  migration:
    # Required safety acknowledgement for MYSQL -> YAML/SQLITE migration.
    # Set true only when exactly one server is using the SQL database and all
    # other network instances are stopped.
    confirm-single-server-mysql: false

    # Inspect source snapshot counts without importing data or changing the
    # last successfully active storage marker.
    dry-run: false

# --- Language and presentation ----------------------------------------------
# Bundled values: EN, DE, ES. Reload-safe.
language: "EN"

prefix:
  # Reload-safe.
  enabled: true
  full_prefix: "§8[§bSodaEconomy§8] §r"

# --- Core economy ------------------------------------------------------------
# Starting wallet balance for a newly created account. Restart required.
balance: 1000

# Maximum wallet balance. A negative value disables the maximum. Restart required.
max_balance: 100000

leaderboard:
  # All leaderboard options are reload-safe.
  enabled: true
  top-entries: 10
  max-entries: 50

currency:
  # Both currency display options are reload-safe.
  symbol: "$"
  display_after_amount: false

# --- Optional integrations ---------------------------------------------------
integrations:
  vault:
    # Registers SodaEconomy as Vault's economy provider when Vault is installed.
    # Vault lifecycle settings are startup-only.
    enabled: true

    # Cancellable wait before an operation has begun durable execution.
    operation-timeout-millis: 3000

    # Rate-limited slow-call warning threshold. 0 disables the warning.
    warn-after-millis: 100

# --- Update checker ----------------------------------------------------------
# Optional informational GitHub Releases check. It never downloads or installs
# files and sends no player/economy/server/plugin-list/database telemetry.
# Every option in this section is reload-safe with /eco reload.
update-checker:
  enabled: true
  # Only github is supported in v1.0.0.
  source: "github"
  # stable | rc | beta | alpha; each channel also accepts more mature releases.
  channel: "stable"
  check-on-startup: true
  # 1..168 hours
  check-interval-hours: 12
  notify-console: true
  notify-admins-on-join: true
  notify-admins-per-session: true
  # Connection timeout: 1..30 seconds
  connect-timeout-seconds: 4
  # Request/response timeout: 1..60 seconds
  read-timeout-seconds: 6

# --- Optional personal banking ----------------------------------------------
# Banking settings are startup-only.
banking:
  enabled: false
  interest_enabled: false
  # Decimal rate: 0.05 = 5%.
  interest_rate: 0.05
  # Minutes between interest runs.
  interest_interval: 60
  # Maximum interest credited per account/interval. 0 disables the cap.
  max_interest_per_account: 0.0

# --- Transaction history -----------------------------------------------------
transactions:
  # Entries per /eco history page. Valid range: 1..100. Restart required.
  history-page-size: 10

# --- Local asynchronous persistence -----------------------------------------
# Applies to YAML/SQLite. MYSQL remains database-authoritative. These settings
# are startup-only; keep defaults unless you are diagnosing an operational need.
persistence:
  async:
    enabled: true
    initial_retry_delay_millis: 100
    maximum_retry_delay_millis: 5000
    shutdown_warning_interval_seconds: 5
    # Maximum accepted local writes waiting for backend persistence.
    queue_capacity: 10000
    # Queue percentage that triggers a rate-limited administrator warning.
    warning_threshold_percent: 80
    # Retries before persistence pauses and recovery probing begins.
    maximum_retry_attempts: 8
    recovery_probe_interval_seconds: 30
    # Maximum normal shutdown drain time before shutdown continues.
    shutdown_timeout_seconds: 30

# --- Debugging ---------------------------------------------------------------
# Enable only the subsystem needed for diagnosis. Restart after changing these
# values for predictable application across all long-lived services.
debug:
  storage: false
  commands: false
  banking: false
  # Includes Vault, PlaceholderAPI and update-checker technical causes.
  integrations: false

# Notes:
# - Do not edit last-storage-type.txt manually.
# - MYSQL configuration errors may prevent a requested migration from starting.
# - SodaEconomy does not silently fall back from a temporarily unavailable shared
#   SQL database, because doing so could create divergent economy state.
