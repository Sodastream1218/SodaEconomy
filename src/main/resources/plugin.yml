name: SodaEconomy
version: 1.0.0
main: de.sodaeconomy.SodaEconomy
api-version: 1.20
author: Sodastreamexpres
description: Production-focused economy system with an immutable transaction journal, safe storage migrations, and an auditable API.
softdepend: [Vault, floodgate, PlaceholderAPI]
libraries:
  - org.mariadb.jdbc:mariadb-java-client:3.5.9

commands:
  balance:
    description: Shows your current wallet balance
    usage: /balance
  topbalance:
    description: Shows the richest players
    usage: /topbalance
    permission: sodaeconomy.topbalance
  pay:
    description: Transfers money to another player
    usage: /pay <player> <amount>
  eco:
    description: Economy administration, transaction history, audit, and statistics
    usage: /eco <history|transaction|rollback|audit|stats|version|reload|set|give|remove|reset|balance|payall|multipay>
  bank:
    description: Bank commands (/bank balance, deposit, withdraw, setbalance)
    usage: /bank <balance|deposit|withdraw|setbalance>
    permission: sodaeconomy.bank.use

permissions:
  sodaeconomy.admin:
    description: Allows all SodaEconomy administrator commands
    default: op
  sodaeconomy.admin.reload:
    description: Allows safe reload of language, prefix, leaderboard, currency, and update-checker settings
    default: op
  sodaeconomy.admin.update:
    description: Allows viewing update information and receiving administrator update notifications
    default: op
  sodaeconomy.history.self:
    description: Allows viewing personal transaction history
    default: true
  sodaeconomy.history.others:
    description: Allows viewing other players' transaction history
    default: op
  sodaeconomy.transaction:
    description: Allows viewing transaction details
    default: op
  sodaeconomy.rollback:
    description: Allows rolling back eligible transactions
    default: op
  sodaeconomy.audit:
    description: Allows viewing player transaction audit summaries
    default: op
  sodaeconomy.stats:
    description: Allows viewing economy statistics
    default: op
  sodaeconomy.topbalance:
    description: Allows use of /topbalance
    default: true
  sodaeconomy.bank.use:
    description: Allows use of player bank commands
    default: true
  sodaeconomy.bank.admin:
    description: Allows use of /bank setbalance
    default: op
