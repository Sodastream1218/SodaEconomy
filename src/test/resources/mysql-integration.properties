# This test-only configuration resolves every connection value from the environment.
# It is never read by the production plugin configuration.
host.environment=SODAECONOMY_TEST_MYSQL_HOST
port.environment=SODAECONOMY_TEST_MYSQL_PORT
database.environment=SODAECONOMY_TEST_MYSQL_DATABASE
user.environment=SODAECONOMY_TEST_MYSQL_USER
password.environment=SODAECONOMY_TEST_MYSQL_PASSWORD

# These are JDBC driver options for the isolated local/CI test database only.
param.useSSL=false
param.allowPublicKeyRetrieval=true
param.connectTimeout=2000
param.socketTimeout=5000
param.serverTimezone=UTC
param.connectionTimeZone=UTC
param.characterEncoding=UTF-8
